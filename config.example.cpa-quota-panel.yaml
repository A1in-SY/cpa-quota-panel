# cpa-quota-panel 配置示例（并入 CLIProxyAPI 的 config.yaml）
plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-quota-panel:
      enabled: true
      # 宿主 config.yaml 路径（容器内固定为这个挂载路径；本地可改成你的路径）
      config-path: "/CLIProxyAPI/config.yaml"
      cache-ttl-seconds: 300
